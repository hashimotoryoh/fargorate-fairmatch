<!--
  大小2つの球を上下にずらして配置し、レーティングの差があるプレイヤー同士の
  対戦を表す。最も小さいヘッダーでは 24px 前後で表示されるため、要素は
  2つに抑える。
-->
<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="currentColor" stroke-width="1.75">
    <circle cx="8" cy="15" r="6.25" />
    <circle cx="17.25" cy="7.75" r="4.25" fill="currentColor" />
  </g>
</svg>
